
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>Reserve sua Mesa</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="formulario">

      
        <div class="cabecalho">

            <h1>Reserve sua Mesa</h1>

            <p>
                Por favor, preencha o formulário abaixo com atenção
                para que possamos atendê-lo da melhor forma possível.
                Seja bem-vindo!
            </p>

        </div>

       
        <form>

          
            <div class="campo">

                <label>Nome Completo</label>

                <div class="nomes">

                    <div>
                        <input type="text" required>
                        <small>Nome</small>
                    </div>

                    <div>
                        <input type="text" required>
                        <small>Sobrenome</small>
                    </div>

                </div>

            </div>

            
            <div class="campo-reserva">

                <label>E-mail</label>

                <input type="email" placeholder="ex: myname@example.com" required>

            </div>

          
            <div class="campo-reserva">

                <label>Telefone</label>

                <input type="tel" required>

            </div>

            
            <div class="campo-reserva">

                <label>Número de Pessoas</label>

                <input type="number" min="1" required>

            </div>

           
            <hr>

            <div class="titulo-reserva">

                <h3>Reserva</h3>

            </div>

            
            <div class="campo-reserva">

                <label>Tipo de Reserva</label>

                <select required>

                    <option value="">Please Select</option>
                    <option>Almoço</option>
                    <option>Jantar</option>
                    <option>Aniversário</option>
                    <option>Encontro</option>
                    <option>Outro</option>

                </select>

            </div>

            
            <div class="campo-reserva">

                <label>Se "Outro" acima, especifique</label>

                <input type="text">

            </div>

            <div class="campo-reserva">

                <label>Pedidos Especiais</label>

                <textarea></textarea>

            </div>

            
            <div class="botao">

                <button type="submit">Enviar</button>

            </div>

        </form>

    </div>

</body>
</html>
