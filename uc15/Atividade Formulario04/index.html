<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário de Cadastro</title>

 <div class="esrcever">
 </div>





  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="caixa">
    <div class="titulo">Formulário de Cadastro</div>

    <form class="formulario" action="#" method="post">

      
      <div class="row mb-4 align-items-start">
        <div class="col-3"><label class="rotulo">Nome e Sobrenome</label></div>
        <div class="col-9">
          <div class="row g-2">
            <div class="col-6">
              <input type="text" class="form-control" id="nome" name="nome">
              <small>Nome</small>
            </div>
            <div class="col-6">
              <input type="text" class="form-control" id="sobrenome" name="sobrenome">
              <small>Sobrenome</small>
            </div>
          </div>
        </div>
      </div>

     
      <div class="row mb-4 align-items-center">
        <div class="col-3"><label class="rotulo" for="empresa">Empresa</label></div>
        <div class="col-9">
          <input type="text" class="form-control" id="empresa" name="empresa">
        </div>
      </div>

    
      <div class="row mb-4 align-items-center">
        <div class="col-3"><label class="rotulo" for="email">Email</label></div>
        <div class="col-9">
          <input type="email" class="form-control" id="email" name="email">
        </div>
      </div>

     
      <div class="row mb-4 align-items-start">
        <div class="col-3"><label class="rotulo">Telefone com DDD</label></div>
        <div class="col-9">
          <div class="row g-2">
            <div class="col-4">
              <input type="text" class="form-control" id="ddd" name="ddd" maxlength="2">
              <small>DDD</small>
            </div>
            <div class="col-8">
              <input type="tel" class="form-control" id="telefone" name="telefone">
              <small>Telefone</small>
            </div>
          </div>
        </div>
      </div>

     
      <div class="row mb-4 align-items-center">
        <div class="col-3"><label class="rotulo" for="sexo">Sexo</label></div>
        <div class="col-9">
          <select class="form-select" id="sexo" name="sexo">
            <option value="">--Selecione a Opção</option>
            <option value="feminino">Feminino</option>
            <option value="masculino">Masculino</option>
            <option value="outro">Outro</option>
          </select>
        </div>
      </div>

     
      <div class="mb-3">
        <label class="rotulo d-block mb-2">Você é iniciante?</label>
        <div class="opcoes d-flex gap-5">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="iniciante" id="sim" value="sim">
            <label class="form-check-label" for="sim">Sim</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="iniciante" id="nao" value="nao">
            <label class="form-check-label" for="nao">Não</label>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-enviar">Enviar</button>
    </form>
  </div>



  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
